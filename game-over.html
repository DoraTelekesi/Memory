<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game over</title>
  </head>
  <body>
    <div class="main-content-wrapper" id="main-content-wrapper">
      <div class="main_food">
        <h1>GAME OVER</h1>
        <p>Final score</p>
        <div class="scores">
          <div class="blue-score">
            <img src="assets/icon/chess_pawn_blue.svg" alt="blue score label" class="blue-score_label" />
            <p class="blue-score_number" id="blue-score">0</p>
          </div>
          <div class="orange-score">
            <img src="assets/icon/chess_pawn_orange.svg" alt="orange-score-label" class="orange-score_label" />
            <p class="orange-score_number" id="orange-score">0</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/game-over.ts"></script>
  </body>
</html>
