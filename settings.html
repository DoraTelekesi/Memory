<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
  </head>
  <body>
    <div class="main_content">
      <div class="main_title">
        <h1 class="main_title-text">Settings</h1>
        <div class="main_title-underline">
          <div class="main_title-underline-polygon"></div>
          <div class="main_title-underline-line"></div>
        </div>
      </div>
      <div class="settings-content">
        <form class="settings_form" action="">
          <div class="settings-content_left">
            <div class="radio_blocks">
              <div class="themes_title title">
                <img src="assets/icon/palette.png" alt="palette" class="themes_title_img" />
                <p class="themes_title_text">Game themes</p>
              </div>
              <div class="themes-list list">
                <div class="themes_selection selection" id="code-vibes-selection">
                  <input type="radio" class="code-vibes" name="theme" id="code-vibes" value="code-vibes" checked />
                  <label for="code-vibes" id="code-vibes-label">Code vibes theme</label>
                  <div class="selection-underline" id="yellow-selector-code">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="themes_selection selection" id="gaming-selection">
                  <input type="radio" class="gaming" name="theme" id="gaming" value="gaming" />
                  <label for="gaming" id="gaming-label">Gaming theme</label>
                  <div class="selection-underline" id="yellow-selector-gaming">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="themes_selection selection" id="da-projects-selection">
                  <input type="radio" class="da-projects" name="theme" id="da-projects" value="da-projects" />
                  <label for="da-projects" id="da-projects-label">DA Projects theme</label>
                  <div class="selection-underline" id="yellow-selector-da-projects">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="themes_selection selection" id="foods-selection">
                  <input type="radio" class="foods" name="theme" id="foods" value="foods" />
                  <label for="foods" id="foods-label">Foods theme</label>
                  <div class="selection-underline" id="yellow-selector-foods">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
              </div>
              <div class="player_title title">
                <img src="assets/icon/chess_pawn.png" alt="chess pawn" class="player_title_img" />
                <p class="player_title_text">Choose player</p>
              </div>
              <div class="player_list list">
                <div class="player_selection selection" id="red-selection">
                  <input type="radio" class="red" name="player" id="red" value="red" />
                  <label for="red" id="red-label">Red</label>
                  <div class="selection-underline" id="yellow-selector-red">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="player_selection selection" id="blue-selection">
                  <input type="radio" class="blue" name="player" id="blue" value="blue" checked />
                  <label for="blue" id="blue-label">Blue</label>
                  <div class="selection-underline" id="yellow-selector-blue">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="player_selection selection" id="orange-selection">
                  <input type="radio" class="orange" name="player" id="orange" value="orange" />
                  <label for="orange" id="orange-label">Orange</label>
                  <div class="selection-underline" id="yellow-selector-orange">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
              </div>
              <div class="board-size_title title">
                <img src="assets/icon/style.png" alt="style" class="board-size_title_img" />
                <p class="board-size_title_text">Choose board size</p>
              </div>
              <div class="board-size_list list">
                <div class="board-size_selection selection" id="small-selection">
                  <input type="radio" class="small" name="board-size" id="small" value="small" checked />
                  <label for="small" id="small-label">16 cards</label>
                  <div class="selection-underline" id="yellow-selector-small">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="board-size_selection selection" id="medium-selection">
                  <input type="radio" class="medium" name="board-size" id="medium" value="medium" />
                  <label for="medium" id="medium-label">24 cards</label>
                  <div class="selection-underline" id="yellow-selector-medium">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
                <div class="board-size_selection selection" id="large-selection">
                  <input type="radio" class="large" name="board-size" id="large" value="large" />
                  <label for="large" id="large-label">36 cards</label>
                  <div class="selection-underline" id="yellow-selector-large">
                    <div class="selection-underline-visible-line"></div>
                    <div class="selection-underline-visible-polygon"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-content_right">
            <div class="theme-visual">
              <div class="theme-visual_background"></div>
            </div>
            <div class="chosen-setup">
              <p>Game theme</p>
              <span class="divider"></span>
              <p>Blue Player</p>
              <span class="divider"></span>
              <p>Boards-16 Cards</p>
              <button class="start_btn">
                <img src="assets/icon/smart_display.png" alt="smart display" class="start_btn-img" />
                <p class="start_btn-text">Start</p>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
